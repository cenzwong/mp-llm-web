<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 3 - MediaPipe Web Inference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #f8fafc;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 10px;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center glass-panel z-10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold">G</div>
            <h1 class="text-lg font-semibold tracking-tight">Gemma 3 <span class="text-blue-400 font-mono text-xs">1B-IT-INT4</span></h1>
        </div>
        <div id="connection-status" class="flex items-center space-x-2 text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500"></span>
            <span id="status-text">Waiting for Model...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col relative">

        <!-- Welcome Overlay / Model Setup -->
        <div id="setup-overlay" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-900 p-6 transition-opacity duration-500">
            <div class="max-w-md w-full glass-panel rounded-2xl p-8 space-y-6 shadow-2xl border border-blue-500/20">
                <div class="text-center">
                    <h2 class="text-2xl font-bold mb-2 text-white">Local Inference Engine</h2>
                    <p class="text-slate-400 text-sm">Upload your Gemma 3 <code>.task</code> file to run inference locally via WebGPU.</p>
                </div>

                <div class="space-y-4">
                    <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-xl p-8 text-center hover:border-blue-500/50 hover:bg-blue-500/5 transition-all cursor-pointer group">
                        <input type="file" id="model-upload" class="hidden" accept=".task">
                        <div class="flex flex-col items-center space-y-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-blue-400 transition-colors"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span class="text-sm font-medium text-slate-300" id="file-label">Select gemma3-1b-it-int4.task</span>
                            <span class="text-[10px] text-slate-500 uppercase tracking-widest">Supports files up to 2GB</span>
                        </div>
                    </div>

                    <button id="load-model-btn" disabled class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-blue-900/20">
                        Start Engine
                    </button>

                    <div id="progress-container" class="hidden space-y-2">
                        <div class="flex justify-between text-xs text-slate-400">
                            <span id="loading-step">Preparing WASM...</span>
                        </div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-blue-500 h-full w-full animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 chat-container">
            <!-- Messages injected here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-6 border-t border-slate-800 glass-panel">
            <div class="max-w-4xl mx-auto flex items-end space-x-4">
                <div class="flex-1 relative">
                    <textarea id="prompt-input" rows="1"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 pr-12 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none max-h-48 overflow-y-auto"
                        placeholder="Ask Gemma something..." disabled></textarea>
                </div>
                <button id="send-btn" disabled class="bg-blue-600 p-3.5 rounded-xl disabled:opacity-50 disabled:bg-slate-700 transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="max-w-4xl mx-auto flex justify-between items-center mt-3 text-[10px] text-slate-500 uppercase tracking-widest">
                <span>Local File Loading</span>
                <span>WebGPU Delegate</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { FilesetResolver, LlmInference } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai';

        const setupOverlay = document.getElementById('setup-overlay');
        const loadBtn = document.getElementById('load-model-btn');
        const modelUpload = document.getElementById('model-upload');
        const dropZone = document.getElementById('drop-zone');
        const fileLabel = document.getElementById('file-label');
        const progressContainer = document.getElementById('progress-container');
        const loadingStep = document.getElementById('loading-step');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let llmInference;
        let selectedFile = null;

        // File Selection Logic
        dropZone.addEventListener('click', () => modelUpload.click());

        modelUpload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileLabel.innerText = selectedFile.name;
                loadBtn.disabled = false;
            }
        });

        // Drag and Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-blue-500/10');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-blue-500/10');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-500/10');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                fileLabel.innerText = selectedFile.name;
                loadBtn.disabled = false;
            }
        });

        // Auto-resize textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function initEngine() {
            if (!selectedFile) return;

            loadBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            loadingStep.innerText = "Initializing MediaPipe WASM...";

            try {
                // Initialize FilesetResolver
                const genaiFileset = await FilesetResolver.forGenAiTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai/wasm"
                );

                loadingStep.innerText = "Loading Model into VRAM...";

                // Create Object URL for the local file
                const modelAssetPath = URL.createObjectURL(selectedFile);

                llmInference = await LlmInference.createFromOptions(genaiFileset, {
                    baseOptions: {
                        modelAssetPath: modelAssetPath
                    },
                    maxTokens: 1024,
                    temperature: 0.7,
                    topK: 40,
                });

                // Clean up the URL after loading
                URL.revokeObjectURL(modelAssetPath);

                // UI Transitions
                statusDot.classList.replace('bg-yellow-500', 'bg-green-500');
                statusText.innerText = "Model Ready (WebGPU)";
                setupOverlay.classList.add('opacity-0');
                setTimeout(() => setupOverlay.remove(), 500);

                promptInput.disabled = false;
                sendBtn.disabled = false;

                addSystemMessage("Engine initialized. Gemma 3 1B is running locally from your file.");

            } catch (error) {
                console.error("Initialization failed", error);
                alert("Failed to load model. Ensure your browser supports WebGPU and the file is a valid MediaPipe .task file.");
                loadBtn.disabled = false;
                progressContainer.classList.add('hidden');
                statusText.innerText = "Error Loading";
                statusDot.classList.replace('bg-yellow-500', 'bg-red-500');
            }
        }

        async function runInference() {
            const prompt = promptInput.value.trim();
            if (!prompt || !llmInference) return;

            promptInput.value = '';
            promptInput.style.height = 'auto';
            promptInput.disabled = true;
            sendBtn.disabled = true;

            addMessage('user', prompt);

            const assistantMsgId = 'msg-' + Date.now();
            const messageElement = createMessageElement('assistant', '...', assistantMsgId);
            chatHistory.appendChild(messageElement);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            let fullText = "";
            const contentSpan = messageElement.querySelector('.content-span');
            contentSpan.classList.add('loading-shimmer', 'rounded', 'px-2');

            try {
                await llmInference.generateResponse(prompt, (partial, done) => {
                    if (fullText === "") {
                        contentSpan.classList.remove('loading-shimmer', 'rounded', 'px-2');
                        contentSpan.innerText = "";
                    }
                    fullText += partial;
                    contentSpan.innerText = fullText;
                    chatHistory.scrollTop = chatHistory.scrollHeight;

                    if (done) {
                        promptInput.disabled = false;
                        sendBtn.disabled = false;
                        promptInput.focus();
                    }
                });
            } catch (err) {
                contentSpan.innerText = "Inference Error: " + err.message;
                promptInput.disabled = false;
                sendBtn.disabled = false;
            }
        }

        function createMessageElement(role, text, id) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-300`;

            const inner = document.createElement('div');
            inner.className = `max-w-[85%] rounded-2xl p-4 ${
                role === 'user'
                ? 'bg-blue-600 text-white rounded-tr-none'
                : 'bg-slate-800 text-slate-200 rounded-tl-none border border-slate-700'
            }`;

            const label = document.createElement('div');
            label.className = `text-[10px] font-bold uppercase tracking-widest mb-1 opacity-50`;
            label.innerText = role === 'user' ? 'You' : 'Gemma';

            const content = document.createElement('span');
            content.className = 'content-span whitespace-pre-wrap leading-relaxed text-sm';
            content.innerText = text;

            inner.appendChild(label);
            inner.appendChild(content);
            div.appendChild(inner);
            if (id) div.id = id;
            return div;
        }

        function addMessage(role, text) {
            chatHistory.appendChild(createMessageElement(role, text));
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex justify-center';
            div.innerHTML = `<span class="bg-slate-900/50 text-slate-500 text-[10px] uppercase tracking-tighter px-4 py-1 rounded-full border border-slate-800">${text}</span>`;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Event Listeners
        loadBtn.addEventListener('click', initEngine);
        sendBtn.addEventListener('click', runInference);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !promptInput.disabled) {
                e.preventDefault();
                runInference();
            }
        });

    </script>
</body>
</html>
